<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Çiftlik V5</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <style>
        /* A-Frame'in kendi VR butonlarını tamamen gizle */
        .a-enter-vr, .a-enter-vr-button, .a-orientation-modal {
            display: none !important;
        }

        /* Arayüz Kaplaması */
        #arayuz-kaplama {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Butonu biraz yukarı taşıyabiliriz veya ortada bırakabiliriz */
            padding-top: 20px;
            pointer-events: none; /* Dokunmayı arkaya geçir */
        }

        /* Bizim Pembe Buton */
        #baslat-butonu {
            pointer-events: auto; /* Sadece buna dokunulabilsin */
            margin-top: 20px;     /* Üstten biraz boşluk */
            padding: 15px 30px;
            background-color: #ff4081; /* Pembe */
            color: white;
            border: 3px solid white;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-family: sans-serif;
            text-transform: uppercase;
            cursor: pointer;
        }

        #baslat-butonu:active {
            transform: scale(0.95);
            background-color: #d81b60;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div id="arayuz-kaplama">
        <button id="baslat-butonu">KAMERAYI AÇ 📷</button>
    </div>

    <a-scene 
        webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #arayuz-kaplama"
        vr-mode-ui="enabled: false"
        ar-hit-test="target: #hedef-halkasi; type: map"
        renderer="antialias: true; alpha: true; physicallyCorrectLights: true;"
        background="color: transparent">

        <a-light type="directional" position="1 4 2" intensity="1.5" color="#ffffff"></a-light>
        <a-light type="ambient" intensity="0.8" color="#ffffff"></a-light>

        <a-entity id="hedef-halkasi" visible="false">
            <a-ring color="white" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.15" opacity="0.8"></a-ring>
            <a-circle color="white" rotation="-90 0 0" radius="0.05" opacity="0.5"></a-circle>
        </a-entity>

        <a-entity id="ciftlik-modeli" visible="false" position="0 0 -2" scale="0.5 0.5 0.5">
            <a-box position="0 -0.05 0" width="3" height="0.1" depth="3" color="#7CB342"></a-box>
            <a-box position="-0.8 0.5 -0.5" width="1" height="1" depth="1" color="#D32F2F"></a-box>
            <a-cone position="-0.8 1.5 -0.5" radius-bottom="0.8" height="0.8" color="#5D4037"></a-cone>
            <a-cylinder position="1 0.4 0.5" radius="0.1" height="0.8" color="#795548"></a-cylinder>
            <a-dodecahedron position="1 1 0.5" radius="0.5" color="#2E7D32"></a-dodecahedron>
        </a-entity>

    </a-scene>

    <script>
        // --- 1. BUTONA BASILINCA KAMERAYI ZORLA AÇMA ---
        document.getElementById('baslat-butonu').addEventListener('click', function() {
            var scene = document.querySelector('a-scene');
            var btn = this;

            btn.innerText = "YÜKLENİYOR...";
            btn.style.backgroundColor = "#9c27b0"; // Mor renk

            // A-Frame'in VR moduna girmesini tetikle
            // (Yukarıdaki 'webxr' ayarları sayesinde bu VR değil AR olarak açılacak)
            scene.enterVR();

            // Butonu gizle (veya arayüzü temizle)
            setTimeout(() => {
                document.getElementById('arayuz-kaplama').style.display = 'none';
            }, 5000); // 5 saniye sonra butonu tamamen kaldır
        });

        // --- 2. MODELİ YERLEŞTİRME MANTIĞI ---
        var scene = document.querySelector('a-scene');
        var reticle = document.querySelector('#hedef-halkasi');
        var farm = document.querySelector('#ciftlik-modeli');
        var placed = false;

        // "ar-hit-test-start" olayı: Zemin algılanmaya başladığında halkayı göster
        scene.addEventListener('enter-vr', function () {
            if (scene.is('ar-mode')) {
                // AR Modundayız, her şey yolunda
                reticle.setAttribute('visible', 'true');
            }
        });

        // Ekrana tıklama olayı
        scene.addEventListener('click', function () {
            if (placed) return; // Zaten koyduysak tekrar koyma

            // Eğer halka görünüyorsa (zemin bulunduysa)
            if (reticle.object3D.visible) {
                // Modeli halkanın yerine taşı
                farm.setAttribute('position', reticle.getAttribute('position'));
                farm.setAttribute('rotation', reticle.getAttribute('rotation'));
                
                // Modeli göster, halkayı gizle
                farm.setAttribute('visible', 'true');
                reticle.setAttribute('visible', 'false');
                
                placed = true;
            }
        });
    </script>
</body>
</html>
